[project]
name = "nod"
version = "0.1.0"
description = "Git-native project management for humans and coding agents."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "mcp>=1.9,<2",
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[project.scripts]
nod = "nod.cli.app:app"
nod-mcp = "nod.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
